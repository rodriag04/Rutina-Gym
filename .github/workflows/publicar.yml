name: Publicar en GitHub Pages

# Se publica en cada push a la rama principal del repositorio (ahora la rama de trabajo; main cuando exista).
on:
  push:
    branches: [main, claude/gym-routine-app-optimized-7fw3i3]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Rodrigo en /Rutina-Gym/ y Mari Carmen en /Rutina-Gym/maricarmen/
      - run: npm run build:pages
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
